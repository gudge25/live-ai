sonar.projectKey=gudge25_live-ai_dc9090aa-e949-4be5-b28a-faa8712b6f0a
sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info,apps/server/coverage/lcov.info,apps/extension/coverage/lcov.info
# Test files sit next to their source (foo.test.ts alongside foo.ts) rather than in a
# separate tests/ directory, so they still need coverage excluded explicitly - otherwise
# Sonar demands coverage for the test files themselves, which of course never has any.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,apps/server/src/main.ts,apps/server/src/dev/**,apps/extension/entrypoints/**,apps/extension/src/components/Options.tsx
# main.ts / extension entrypoints are pure process/wiring glue with no independently
# testable logic; dev/** is a manual local-dev script, never part of the shipped app;
# Options.tsx has no coverage because this repo has no React component-testing setup
# yet (no @testing-library/react) - excluded rather than silently counted as untested.
