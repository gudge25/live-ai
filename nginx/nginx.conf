# Edge proxy for Live AI. Rendered includes (/etc/nginx/rendered/*) are written
# and hot-reloaded by entrypoint.sh: the TLS cert paths and the PBX allow list.
#
# live-ai is resolved lazily through Docker's DNS (127.0.0.11) rather than at
# config load, so nginx still boots — and can answer the ACME challenge — while
# live-ai is stopped or crash-looping on an unfinished .env.

worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # :80 — Let's Encrypt HTTP-01 challenge, everything else redirects to HTTPS.
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # :443 — wss://<PUBLIC_DOMAIN>/ui -> live-ai:8765. Nothing else is exposed.
  server {
    listen 443 ssl default_server;
    server_name _;
    include /etc/nginx/rendered/ssl.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    location = /ui {
      set $ui_upstream live-ai:8765;
      proxy_pass http://$ui_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      # An idle extension connection is normal; don't cut it after the 60s default.
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    location / {
      return 404;
    }
  }
}

# :9092 — AudioSocket (raw PCM from Asterisk). Source-IP allow list only; the
# stream itself is NOT encrypted.
stream {
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format audio '$remote_addr [$time_local] $protocol status=$status '
                   'in=$bytes_received out=$bytes_sent t=$session_time';
  access_log /dev/stdout audio;

  server {
    listen 9092;
    include /etc/nginx/rendered/allow.conf;

    set $audio_upstream live-ai:9092;
    proxy_pass $audio_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_socket_keepalive on;
  }
}
